name: Test

on:
  push:
    branches:
      - "main"

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: website

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
