<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="referrer" content="no-referrer" />

    <title>OpenCCW OAuth</title>
    <link rel="icon" href="https://m.ccw.site/approvel_tag/e3b282acb4372e228b44da75d8746286.png">

    <link rel="dns-prefetch" href="https://www.ccw.site">
    <link rel="dns-prefetch" href="https://community-web.ccw.site">

    <link rel="canonical" href="https://openccw.github.io/OAuth/">
    <meta name="robots" content="index, follow">
    <meta name="description" content="第三方网站使用 OAuth 登录共创世界 CCW 账号。">

    <style>
        body {
            margin-bottom: 24px;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            cursor: default;
        }

        #btnLoginCCW {
            padding: 6px 16px;
            font-size: 14px;
        }

        #textareaResult {
            box-sizing: border-box;
            max-width: 100%;
            width: 115em;
            height: 30em;
        }
    </style>
</head>

<body>
    <h1>OpenCCW OAuth</h1>

    <p>第三方网站使用 OAuth 登录共创世界 CCW 账号。</p>
    <p>Github: <a href="https://github.com/OpenCCW/OAuth" target="_blank" rel="noopener noreferrer">OpenCCW/OAuth</a>
    </p>
    <p>该网页仅演示功能，不会保存您的 Token（登录会话密码）。</p>

    <div><button id="btnLoginCCW" disabled>登录 CCW
            账号</button>
    </div>

    <p>回执：（截图后记得打码，防止被盗号）</p>
    <div><textarea id="textareaResult" readonly></textarea></div>

    <script src="https://cdn.jsdelivr.net/npm/tinyhmacmd5"></script>
    <script src="main.js"></script>
</body>

</html>
